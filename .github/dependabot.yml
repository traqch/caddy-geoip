version: 2

# Nothing in this repo is auto-merged, and that is deliberate.
#
# The org rule is that tooling bumps merge on their own once CI is green, and
# that anything critical never does. mvp1-shared and mvp1-cf-workers act on the
# first half through a dev-tooling group and dependabot-automerge.yml. This repo
# has no dev-tooling at all: the Go module is a Caddy plugin that is compiled
# into the internet-facing edge, so every dependency in it is runtime code.
#
# Dependabot therefore only opens PRs; a human reads and merges each one. There
# is no dependabot-automerge.yml here, and none should be added.

updates:
  # One gomod entry: go.mod and go.sum sit at the repo root. Dependabot rejects
  # two entries with the same ecosystem + directory, so the differing treatment
  # per dependency is expressed through `groups`.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Zurich"

    # A grouped PR is amended in place when new versions land, so `daily`
    # yields at most one open PR for the group rather than one per day.
    #
    # `update-types` restricts the group to minor + patch. Major bumps then fall
    # outside it and arrive as individual PRs — which is what we want, because
    # only they need to be read before merging.
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # One group plus headroom for the individual major-bump PRs.
    open-pull-requests-limit: 4

  # There is no docker entry: this repo has no Dockerfile. The plugin is built
  # into the image in traqch/edge, which has its own configuration.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    groups:
      # No `update-types` cap here, unlike the gomod group: ci.yml pins actions
      # to floating major tags (`@v4`), so upstream minor and patch releases
      # never change the pinned string and Dependabot only ever raises majors
      # for this ecosystem. The group therefore exists to bundle those majors
      # into one reviewable PR. Merged by hand like everything else here.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
